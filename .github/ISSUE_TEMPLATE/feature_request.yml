name: Feature request
description: Suggest something Assist Learner should learn or do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the command or situation, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: textarea
    id: example
    attributes:
      label: Example utterances
      description: A few things you'd say that this would apply to.
