[project]
name = "assist-learner"
version = "0.1.0"
requires-python = ">=3.14"

[dependency-groups]
test = [
  "pytest-homeassistant-custom-component",
  "hassil==3.12.1",
  "home-assistant-intents==2026.8.28",
  "gazetteer-matcher==1.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
